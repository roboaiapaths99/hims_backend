# ==============================================================================
# Nginx Configuration for technulhims.technula.com
# Reverse Proxy for Frontend (:3000) & FastAPI Backend (:8070)
# ==============================================================================

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name technulahims.technula.com technulhims.technula.com;

    return 301 https://$host$request_uri;
}

# 2. HTTPS Main Application Server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name technulahims.technula.com technulhims.technula.com;

    # SSL Certificates (Automated via Certbot Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/technulhims.technula.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/technulhims.technula.com/privkey.pem;

    # SSL Security Hardening (A+ Rating)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ─── API Backend Reverse Proxy (FastAPI on Port 8070) ────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;

        # Medical imaging, DICOM, X-rays, lab documents upload limit
        client_max_body_size 50M;
    }

    # ─── Socket.IO Realtime WebSocket Proxy ──────────────────────────
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8070;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ─── Uploads & Medical Documents Proxy ───────────────────────────
    location /uploads/ {
        proxy_pass http://127.0.0.1:8070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Health & Readiness Checks ───────────────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:8070/health;
        proxy_set_header Host $host;
    }

    location /ready {
        proxy_pass http://127.0.0.1:8070/ready;
        proxy_set_header Host $host;
    }

    # ─── Frontend SPA (Built static assets) ───────────────────────────
    root /var/www/hims/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
