services:
  # ─── Redis (Token blocklist, caching & message broker) ─────────────
  redis:
    image: redis:7-alpine
    container_name: hmis-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - hmis-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── HMIS Backend API (FastAPI on Port 8070) ────────────────────────
  hmis-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hmis-backend-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8070:8070"
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8070
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: "1"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - api_uploads:/app/uploads
    networks:
      - hmis-network
    deploy:
      resources:
        limits:
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Celery Background Worker ──────────────────────────────────────
  hmis-celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hmis-celery-worker
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=info -c 2
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - hmis-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
  api_uploads:

networks:
  hmis-network:
    driver: bridge
